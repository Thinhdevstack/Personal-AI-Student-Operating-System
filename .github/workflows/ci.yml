name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, unit tests, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/module-map.mjs --check   # docs/ARCHITECTURE.md lists every module
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  platforms:
    name: Runs on ${{ matrix.os }} (server, machine panel, installer)
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: npm run smoke

  e2e:
    name: End-to-end (demo office in a browser)
    runs-on: ubuntu-24.04   # (ubuntu-latest is Ubuntu 26.04 since 19/10/2026, which Playwright 1.56 has no browsers for)
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: npx playwright install --with-deps chromium
      # the smoke tests only, for a quick answer: every test runs in e2e-full.yml, split across runners
      - name: Office and academic smoke tests
        run: npm run test:e2e:smoke -- --workers=1
      - name: Student simulation smoke test
        run: npm run test:e2e:student-demo -- --reporter=list,html
        env:
          OFFICE_DIST_DIR: .next
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/student-demo
      - name: Ollama protocol fixture smoke test (no model download)
        run: npm run test:e2e:student-local -- --reporter=list,html
        env:
          OFFICE_DIST_DIR: .next
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/student-local
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            test-results-student-demo/
            test-results-student-local/
            !test-results/office-data/**
            !test-results/home/**
          retention-days: 7
